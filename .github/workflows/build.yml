name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-java@v4.7.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle permission
        run: find . -name "gradlew" -exec chmod +x {} \;

      - name: Decode debug keystore
        run: find . -name "debug.keystore.base64" -exec sh -c 'base64 -d "$1" > "$(dirname $1)/debug.keystore"' _ {} \;

      - name: Create .env file
        run: find . -name ".env.example" -exec sh -c 'cp "$1" "$(dirname $1)/.env"' _ {} \;

      - name: Build debug APK
        run: find . -name "gradlew" -execdir ./gradlew assembleDebug \;

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/apk/debug/app-debug.apk"
          retention-days: 7

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-java@v4.7.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle permission
        run: find . -name "gradlew" -exec chmod +x {} \;

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks

      - name: Create .env file
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          find . -name ".env.example" -exec sh -c 'cp "$1" "$(dirname $1)/.env"' _ {} \;
          if [ -n "$GEMINI_API_KEY" ]; then
            find . -name ".env" -exec sed -i "s/MY_GEMINI_API_KEY/$GEMINI_API_KEY/" {} \;
          fi

      - name: Build release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: find . -name "gradlew" -execdir ./gradlew assembleRelease \;

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: "**/apk/release/app-release.apk"
          retention-days: 30

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: "**/*.apk"
